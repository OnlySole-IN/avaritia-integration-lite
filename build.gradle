buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {

    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'


            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "CurseForge"
        url = "https://cursemaven.com"
    }
    maven {
        name = "AppleSkin API"
        url = "https://maven.ryanliptak.com/"
    }
    maven {
        name = "Create Mod Maven"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "FirstDarkDev Snapshots"
        url = "https://maven.firstdark.dev/snapshots"
    }
    maven {
        name = "Toma Configuration Maven"
        url = "https://repo.repsy.io/mvn/toma/public/"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    //Avaritia
    implementation fg.deobf("curse.maven:re-avaritia-623969:8838608")
    //JEI
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")
    //Create
    implementation fg.deobf("curse.maven:create-328085:7178761")
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-1.20.1:1.0.80")
    compileOnly fg.deobf("com.tterrag.registrate:Registrate:MC1.20-1.3.3")
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-1.20.1:1.0.6-beta-266")
    compileOnly fg.deobf("curse.maven:createaddition-439890:7208610")
//    runtimeOnly fg.deobf("curse.maven:createaddition-439890:7208610")
    //Mekanism
    implementation fg.deobf("curse.maven:mekanism-268560:6552911")
    //implementation fg.deobf("curse.maven:mekanism-additions-345425:6552913")//Additions
    implementation fg.deobf("curse.maven:mekanism-generators-268566:6552914")//Generators
    //implementation fg.deobf("curse.maven:mekanism-tools-268567:6552915")//Tools
    //Emek
    runtimeOnly fg.deobf("curse.maven:iglee-library-541199:6987117")
    implementation fg.deobf("curse.maven:evolved-mekanism-1230085:7599591")
    //Blood Magic
    implementation fg.deobf("curse.maven:blood-magic-224791:8516586")
    //Applied Energistics
    implementation fg.deobf("curse.maven:guideme-1173950:8204776")
    implementation fg.deobf("curse.maven:applied-energistics-2-223794:8991271")
    //Patchouli
    implementation fg.deobf("curse.maven:patchouli-306770:7731017")
    //Curios
    implementation fg.deobf("curse.maven:curios-309927:6418456")
    //Jade
    implementation fg.deobf("curse.maven:jade-324717:8479276")
    //SlashBlade
    implementation fg.deobf("curse.maven:slashblade-resharped-1022428:8090912")
    //Mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:[0.4.1,0.5.0)"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:[0.4.1,0.5.0)"))

    implementation fg.deobf("com.lowdragmc.ldlib:ldlib-forge-${mc_version}:${ldlib_version}") { transitive = false }
    implementation fg.deobf("dev.toma.configuration:configuration-forge-${mc_version}:${configuration_version}")

}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ["-Xlint:-removal"]
    options.compilerArgs += ["-Xlint:-deprecation"]
}